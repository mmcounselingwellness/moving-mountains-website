backend:
  name: github
  repo: mmcounselingwellness/moving-mountains-website
  branch: production
  base_url: https://api.netlify.com
  auth_endpoint: auth

publish_mode: editorial_workflow

local_backend: true

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "site_settings"
    label: "Site Settings"
    files:
      - name: "settings"
        label: "General Settings"
        file: "content/settings/site.json"
        fields:
          - { label: "Banner Text", name: "bannerText", widget: "string" }
          - { label: "Banner Link", name: "bannerLink", widget: "string", default: "/contact-us" }
          - { label: "Logo (horizontal)", name: "logoHorizontal", widget: "image" }
          - { label: "Logo (vertical)", name: "logoVertical", widget: "image" }
          - { label: "Logo (white, footer)", name: "logoWhite", widget: "image" }
          - { label: "Logo (tall, mobile menu)", name: "logoTall", widget: "image" }

          - label: "Footer Contact CTA"
            name: "footerCta"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
              - { label: "CTA Label", name: "ctaLabel", widget: "string" }
              - { label: "CTA Link", name: "ctaLink", widget: "string", default: "/contact-us" }

          - label: "Address"
            name: "address"
            widget: "object"
            fields:
              - { label: "Street", name: "street", widget: "string" }
              - { label: "Street note (for schema, e.g. 'above Mountain Side Cafe')", name: "streetNote", widget: "string", required: false }
              - { label: "City", name: "city", widget: "string" }
              - { label: "State", name: "state", widget: "string" }
              - { label: "Zip", name: "zip", widget: "string" }

          - label: "Geo Coordinates"
            name: "geo"
            widget: "object"
            fields:
              - { label: "Latitude", name: "lat", widget: "number", value_type: "float" }
              - { label: "Longitude", name: "lng", widget: "number", value_type: "float" }

          - { label: "Email", name: "email", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string", required: false }

          - label: "Hours"
            name: "hours"
            widget: "list"
            fields:
              - { label: "Days (e.g. Monday-Friday)", name: "days", widget: "string" }
              - { label: "Opens", name: "opens", widget: "string" }
              - { label: "Closes", name: "closes", widget: "string" }

          - label: "Areas Served"
            name: "areaServed"
            widget: "list"
            fields:
              - { label: "City/Area", name: "name", widget: "string" }

          - label: "Service Catalog (for schema.org)"
            name: "serviceCatalog"
            widget: "list"
            fields:
              - { label: "Service Name", name: "name", widget: "string" }

  - name: "navigation"
    label: "Navigation"
    files:
      - name: "nav"
        label: "Navigation"
        file: "content/settings/navigation.json"
        fields:
          - label: "Main Navigation"
            name: "mainNav"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - label: "Page"
                name: "page"
                widget: "relation"
                required: false
                collection: "pages"
                search_fields: ["title"]
                display_fields: ["title"]
                value_field: "{{slug}}"
              - { label: "Custom URL (for links outside the pages collection, e.g. bio pages)", name: "url", widget: "string", required: false }
              - label: "Dropdown items"
                name: "children"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Custom URL", name: "url", widget: "string", required: false }

          - label: "Footer Navigation"
            name: "footerNav"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - label: "Page"
                name: "page"
                widget: "relation"
                required: false
                collection: "pages"
                search_fields: ["title"]
                display_fields: ["title"]
                value_field: "{{slug}}"
              - { label: "Custom URL (for links outside the pages collection, e.g. /privacy)", name: "url", widget: "string", required: false }

  - name: "pages"
    label: "Pages"
    folder: "content/pages"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — /{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "SEO Description", name: "description", widget: "text" }
      - { label: "Show in search engines", name: "index", widget: "boolean", default: true }
      - label: "Sections"
        name: "sections"
        widget: "list"
        types:
          - label: "Text + Image"
            name: "text_image"
            widget: "object"
            summary: "Text + Image"
            fields:
              - label: "Content"
                name: "content"
                widget: "markdown"
                required: false
                hint: "Use Heading 2 for the headline, Heading 3 for the eyebrow label, Heading 4 for the subline. Regular paragraphs become body text. Use the image button to add inline images, and the CTA Button toolbar button to add a button anywhere in the flow."
                editor_components: ["cta-button"]
              - label: "Layout"
                name: "layout"
                widget: "list"
                min: 1
                max: 1
                summary: "{{fields.label}}"
                types:
                  - label: "Text Only (no image)"
                    name: "text-only"
                    widget: "object"
                    fields:
                      - { label: "Layout", name: "label", widget: "hidden", default: "Text Only" }

                  - label: "Image Left"
                    name: "image-left"
                    widget: "object"
                    fields:
                      - { label: "Layout", name: "label", widget: "hidden", default: "Image Left" }
                      - { label: "Image", name: "image", widget: "image" }
                      - { label: "Image alt text", name: "imageAlt", widget: "string", required: false }

                  - label: "Image Right"
                    name: "image-right"
                    widget: "object"
                    fields:
                      - { label: "Layout", name: "label", widget: "hidden", default: "Image Right" }
                      - { label: "Image", name: "image", widget: "image" }
                      - { label: "Image alt text", name: "imageAlt", widget: "string", required: false }

                  - label: "Gallery"
                    name: "gallery"
                    widget: "object"
                    fields:
                      - { label: "Layout", name: "label", widget: "hidden", default: "Gallery" }
                      - label: "Gallery images"
                        name: "images"
                        widget: "list"
                        fields:
                          - { label: "Image", name: "src", widget: "image" }
                          - { label: "Alt text", name: "alt", widget: "string" }

                  - label: "Full Width Image"
                    name: "full-image"
                    widget: "object"
                    fields:
                      - { label: "Layout", name: "label", widget: "hidden", default: "Full Width Image" }
                      - { label: "Image", name: "image", widget: "image" }
                      - { label: "Image alt text", name: "imageAlt", widget: "string", required: false }

                  - label: "Full Bleed, Text Overlay Left"
                    name: "overlay-left"
                    widget: "object"
                    fields:
                      - { label: "Layout", name: "label", widget: "hidden", default: "Full Bleed, Text Overlay Left" }
                      - { label: "Image", name: "image", widget: "image" }
                      - { label: "Image alt text", name: "imageAlt", widget: "string", required: false }

                  - label: "Full Bleed, Text Overlay Right"
                    name: "overlay-right"
                    widget: "object"
                    fields:
                      - { label: "Layout", name: "label", widget: "hidden", default: "Full Bleed, Text Overlay Right" }
                      - { label: "Image", name: "image", widget: "image" }
                      - { label: "Image alt text", name: "imageAlt", widget: "string", required: false }

                  - label: "Hero (Full-Bleed, Image Right)"
                    name: "hero-image-right"
                    widget: "object"
                    fields:
                      - { label: "Layout", name: "label", widget: "hidden", default: "Hero (Full-Bleed, Image Right)" }
                      - { label: "Image", name: "image", widget: "image" }
                      - { label: "Image alt text", name: "imageAlt", widget: "string", required: false }

                  - label: "Hero (Full-Bleed, Image Left)"
                    name: "hero-image-left"
                    widget: "object"
                    fields:
                      - { label: "Layout", name: "label", widget: "hidden", default: "Hero (Full-Bleed, Image Left)" }
                      - { label: "Image", name: "image", widget: "image" }
                      - { label: "Image alt text", name: "imageAlt", widget: "string", required: false }

          - label: "Feature List"
            name: "feature_list"
            widget: "object"
            summary: "Feature List — {{fields.heading}}"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string", required: false }
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Intro", name: "intro", widget: "text", required: false }
              - { label: "Background image (optional)", name: "bgImage", widget: "image", required: false }
              - { label: "Background image alt text", name: "bgImageAlt", widget: "string", required: false }
              - { label: "Style", name: "style", widget: "select", options: ["grid", "checklist", "plain-list"], default: "checklist" }
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Description", name: "description", widget: "string", required: false }
              - label: "CTA"
                name: "cta"
                widget: "object"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string", required: false }
                  - { label: "Link", name: "link", widget: "string", required: false }

          - label: "FAQ Items"
            name: "faq_items"
            widget: "object"
            summary: "FAQ — {{fields.heading}}"
            fields:
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Question", name: "question", widget: "string" }
                  - { label: "Answer", name: "answer", widget: "markdown" }

  - name: "team"
    label: "Team Members"
    folder: "content/team"
    create: true
    identifier_field: name
    slug: "{{slug}}"
    summary: "{{name}} — /{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Credentials", name: "credentials", widget: "string" }
      - { label: "Order", name: "order", widget: "number" }
      - { label: "Status", name: "status", widget: "select", options: ["accepting", "waitlist", "not_accepting"] }
      - { label: "Status line", name: "statusLine", widget: "string", required: false }
      - { label: "Photo", name: "photo", widget: "image" }
      - { label: "Photo alt text", name: "photoAlt", widget: "string" }
      - { label: "Eyebrow (e.g. 'Meet Kate')", name: "eyebrow", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string" }
      - { label: "Card bio (short, for team listing)", name: "cardBio", widget: "text" }
      - { label: "List section heading", name: "listSectionHeading", widget: "string", required: false }
      - label: "List items"
        name: "listItems"
        widget: "list"
        fields:
          - { label: "Item", name: "item", widget: "string" }
      - { label: "CTA label", name: "ctaLabel", widget: "string" }
      - { label: "Body (long narrative bio)", name: "body", widget: "markdown" }

  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Featured image", name: "featured_image", widget: "image" }
      - { label: "Image alt text", name: "image_alt", widget: "string" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - { label: "Body", name: "body", widget: "markdown" }
      - label: "Gallery images"
        name: "galleryImages"
        widget: "list"
        required: false
        fields:
          - { label: "Image", name: "src", widget: "image" }
          - { label: "Alt text", name: "alt", widget: "string" }
