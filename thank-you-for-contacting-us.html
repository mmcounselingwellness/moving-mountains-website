<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex">

  <!-- Analytics Manager - Load BEFORE Google Analytics -->
  <script src="js/analytics-manager.js"></script>

  <title>Thank You | Moving Mountains Counseling & Wellness</title>
  <meta name="description" content="Thank you for reaching out to Moving Mountains Counseling & Wellness. We'll be in touch within one business day.">
  <link rel="canonical" href="https://mmcounselingwellness.com/thank-you-for-contacting-us" />
  <link href="dist/output.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>

  <!-- Google Font: Fraunces -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Component Loader -->
  <script src="js/components.js"></script>

  <!-- Cookie Consent Manager -->
  <script src="js/cookie-consent.js"></script>

  <style>#contact { display: none; }</style>

</head>

<body class="font-raleway bg-custom">

  <!-- Header Component -->
  <div id="header-component"></div>
  <!-- End Header Component -->

  <div id="main-content" class="relative isolate bg-white">
    <div class="absolute inset-0 -z-10 overflow-hidden">
      <img src="src/sunbeams.jpg" alt="" class="absolute inset-0 size-full object-cover opacity-10" aria-hidden="true" />
    </div>

    <div class="mx-auto max-w-2xl px-6 py-32 sm:py-48 lg:px-8 text-center">

      <!-- Checkmark icon -->
      <div class="mx-auto mb-8 flex size-16 items-center justify-center rounded-full bg-heading/10">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-8 text-heading" aria-hidden="true">
          <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm13.36-1.814a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z" clip-rule="evenodd" />
        </svg>
      </div>

      <p class="text-base font-semibold text-primary">Message received</p>
      <h1 class="mt-3 text-4xl font-fraunces tracking-tight text-heading sm:text-5xl">We're glad you reached out.</h1>
      <p class="mt-6 text-lg/8 text-gray-600">Someone from our team will be in touch within one business day — no pressure, no scripts, just a real person ready to listen.</p>

      <p class="mt-4 text-base/7 text-gray-500">In the meantime, feel free to look around. You're already in the right place.</p>

      <div class="mt-10 flex flex-col sm:flex-row items-center justify-center gap-4">
        <a href="our-team" class="bg-primary text-white hover:bg-secondary transition-colors px-5 py-2.5 text-sm font-medium rounded-lg">Meet our therapists</a>
        <a href="services" class="text-sm/6 font-semibold text-heading">Explore our services <span aria-hidden="true">&rarr;</span></a>
      </div>

    </div>
  </div>

  <!-- Footer Component -->
  <div id="footer-component"></div>
  <!-- End Footer Component -->

  <!-- Cookie Consent Component -->
  <div id="cookie-consent-component"></div>
  <!-- End Cookie Consent Component -->

</body>
</html>
